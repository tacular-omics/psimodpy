# Standard tacular-omics CI. Canonical copy: tacular-omics workspace templates/.
# Package-specific jobs (docs, paper, extras matrices) live in separate workflow
# files or are appended below the standard jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Package-specific: CI runs the full suite. Locally, slow tests are skipped and
# Hypothesis runs 50 examples (tests/conftest.py).
env:
  RUN_SLOW: "1"
  HYPOTHESIS_PROFILE: thorough

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: python scripts/release_version.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests

  # Proves the declared lower bounds still work: installs the oldest allowed
  # version of every direct dependency.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct --all-extras --all-groups
      # --no-sync is required: a plain `uv run` re-resolves to the default (highest)
      # versions and silently undoes the lowest-direct sync above.
      # This job inherits RUN_SLOW and HYPOTHESIS_PROFILE from the workflow env above,
      # and it has to: it is the only job that resolves the floors we publish, so a slow
      # test skipped here would leave a floor unguarded. If that env is ever narrowed to
      # specific jobs, this one must keep both.
      - run: uv run --no-sync pytest tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: python scripts/release_version.py check --dist dist
      - name: Check the bundled PSI-MOD.obo data file made it into the wheel
        run: |
          python -c "
          import glob, sys, zipfile
          for wheel in glob.glob('dist/*.whl'):
              names = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith('.obo')]
              if not names:
                  sys.exit(f'{wheel} is missing the bundled PSI-MOD.obo data file')
              print(wheel, names)
          "
      - name: Import the built wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('${{ github.workspace }}/pyproject.toml','rb'))['project']['name'].replace('-','_'))")
          uv run --isolated --no-project --with "$(ls ${{ github.workspace }}/dist/*.whl)" python -c "import $pkg; print($pkg.__version__)"

  # Package-specific: branch coverage uploaded to Codecov. Report only, no threshold.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/psimodpy
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/psimodpy
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  # Same hooks contributors run at commit time (.pre-commit-config.yaml).
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # Package-specific: the Vercel deploy surface (vercel.json, api/index.py), which nothing in
  # src/ can reach and which only a Vercel build had ever exercised. The environment is built by
  # vercel.json's own installCommand, with Vercel's no-installCommand default as the fallback, so
  # a deleted installCommand fails here with the ModuleNotFoundError it would put in production
  # rather than with a reading of the file. See tests/test_deploy_surface.py.
  deploy-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The requires-python floor, which is the interpreter Vercel's Python runtime picks
          # (its build log: "Using Python 3.12 from pyproject.toml"). Compared against the
          # pyproject by test_the_job_builds_on_the_python_vercel_picks, so a requires-python
          # bump cannot leave this job behind in silence.
          python-version: "3.12"
      - name: Install the way vercel.json installs
        run: |
          uv venv
          export VIRTUAL_ENV="$PWD/.venv"
          command=$(python3 -c "import json;print(json.load(open('vercel.json')).get('installCommand') or 'uv pip install .')")
          echo "installCommand: $command"
          eval "$command"
          uv pip install pytest
      - name: Run the deploy-surface tests with the gate on
        env:
          PSIMODPY_REQUIRE_DEPLOY_SURFACE: "1"
        # --noconftest because tests/conftest.py imports hypothesis, which the deploy does not
        # install; installing it would take this job's environment away from the deploy's, which
        # is the job's whole claim. Asserted by test_the_job_runs_without_what_the_deploy_does_not_install.
        run: .venv/bin/python -m pytest -q --noconftest tests/test_deploy_surface.py
