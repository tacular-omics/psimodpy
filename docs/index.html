<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSI-MOD Browser — psimodpy</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh;font-size:14px}
a{color:#3b82f6;text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:.9em}
header{background:#1e293b;color:#f8fafc;padding:1.25rem 1.5rem}
.hi{max-width:1300px;margin:0 auto;display:flex;gap:1rem;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.03em}
.sub{color:#94a3b8;font-size:.85rem;margin-top:.2rem}
.hm{display:flex;align-items:center;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.ct{background:#3b82f6;color:#fff;font-size:.75rem;font-weight:700;padding:.15rem .55rem;border-radius:999px}
.pl{background:#334155;color:#cbd5e1;font-size:.75rem;padding:.15rem .55rem;border-radius:999px}
.pl:hover{background:#475569;text-decoration:none;color:#f8fafc}
.rel{color:#94a3b8;font-size:.8rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;align-self:flex-end}
.rel a{color:#93c5fd}
main{max-width:1300px;margin:1rem auto;padding:0 1rem}
.tb{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.tb input[type=search]{flex:1;min-width:180px;padding:.5rem .75rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.875rem;background:#fff;outline:none;color:#1a202c}
.tb input[type=search]:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #dbeafe80}
.tb select{padding:.45rem .65rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.8rem;background:#fff;outline:none;cursor:pointer;color:#374151}
.tb select:focus{border-color:#3b82f6}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;flex-wrap:wrap;gap:.4rem}
.rc{font-size:.8rem;color:#6b7280}
.pc{display:flex;align-items:center;gap:.4rem}
.pc select{padding:.3rem .5rem;border:1px solid #d1d5db;border-radius:.4rem;font-size:.8rem;background:#fff;cursor:pointer}
.pc button{padding:.3rem .65rem;border:1px solid #d1d5db;background:#fff;border-radius:.4rem;cursor:pointer;font-size:.8rem;color:#374151;line-height:1.2}
.pc button:hover:not(:disabled){background:#f9fafb;border-color:#9ca3af}
.pc button:disabled{opacity:.35;cursor:default}
.pi{font-size:.8rem;color:#6b7280;min-width:60px;text-align:center}
.tw{background:#fff;border:1px solid #e5e7eb;border-radius:.75rem;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead{background:#f9fafb}
th{padding:.65rem .9rem;text-align:left;font-weight:600;color:#374151;border-bottom:2px solid #e5e7eb;white-space:nowrap;user-select:none}
th[data-col]{cursor:pointer}
th[data-col]:hover{background:#f0f4f8}
.si::after{content:" ⇕";color:#d1d5db}
.sa::after{content:" ↑";color:#3b82f6}
.sd::after{content:" ↓";color:#3b82f6}
td{padding:.55rem .9rem;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.dr:hover td{background:#fafafa;cursor:pointer}
.ic{font-family:ui-monospace,monospace;color:#2563eb;font-weight:600;font-size:.82rem;white-space:nowrap}
.nc{font-weight:500}
.fc{font-family:ui-monospace,monospace;color:#7c3aed;font-size:.82rem}
.mc{font-family:ui-monospace,monospace;font-size:.82rem;text-align:right;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:.2rem}
.tag{border-radius:.3rem;padding:.1rem .4rem;font-size:.72rem;white-space:nowrap;border:1px solid;line-height:1.4}
.tb0{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.tg0{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.tp0{background:#faf5ff;color:#6d28d9;border-color:#ddd6fe}
.to0{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.tgr{background:#f9fafb;color:#6b7280;border-color:#e5e7eb}
.trd{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.term-link{display:inline-flex;align-items:baseline;gap:.35rem;text-decoration:none;cursor:pointer}
.term-link:hover{text-decoration:none;background:#dbeafe;border-color:#93c5fd}
.term-link .tid{font-family:ui-monospace,monospace;font-weight:600}
.term-link .tnm{font-weight:500;white-space:normal}
.term-list{display:flex;flex-wrap:wrap;gap:.3rem}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.65rem;margin-bottom:.5rem}
.dl{font-size:.72rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.2rem}
.dv{font-size:.84rem;color:#1a202c;word-break:break-word}
.mono{font-family:ui-monospace,monospace;font-size:.85em}
.st{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:.5rem;border:1px solid #e5e7eb}
.st th{background:#f1f5f9;padding:.35rem .65rem;text-align:left;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb}
.st td{padding:.3rem .65rem;border-bottom:1px solid #f1f5f9}
.st tr:last-child td{border-bottom:none}
.nr{text-align:center;padding:2.5rem;color:#9ca3af}
.dv-back{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .85rem;border:1px solid #d1d5db;border-radius:.5rem;background:#fff;cursor:pointer;font-size:.84rem;color:#374151;margin-bottom:.75rem;font-family:inherit}
.dv-back:hover{background:#f9fafb;border-color:#9ca3af}
.dv-hd{background:#fff;border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem 1.25rem;margin-bottom:.75rem}
.dv-id{font-family:ui-monospace,monospace;color:#2563eb;font-weight:600;font-size:.9rem}
.dv-nm{font-size:1.3rem;font-weight:700;margin-top:.25rem;color:#1a202c}
.dv-bd{background:#fff;border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem 1.25rem}
.ms{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.75rem}
.ms label{font-size:.8rem;color:#374151;display:flex;align-items:center;gap:.3rem}
.ms input{width:9rem;padding:.45rem .65rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.8rem;background:#fff;outline:none;color:#1a202c;font-family:ui-monospace,monospace}
.ms input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #dbeafe80}
.ms input.bad{border-color:#ef4444}
.ms select{padding:.45rem .65rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.8rem;background:#fff;outline:none;cursor:pointer;color:#374151}
.ms select:focus{border-color:#3b82f6}
.mi{cursor:help;color:#6b7280;border:1px solid #d1d5db;border-radius:999px;width:1.3rem;height:1.3rem;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;background:#fff}
.mmsg{font-size:.78rem;color:#b91c1c}
table.nomass .ec{display:none}
@media(max-width:640px){header{padding:1rem}.hi{flex-direction:column}main{padding:0 .5rem}}
</style>
</head>
<body>
<header>
  <div class="hi">
    <div>
      <h1>psimodpy</h1>
      <p class="sub">PSI-MOD protein modification ontology</p>
      <div class="hm">
        <span class="ct" id="ec">loading…</span>
        <a class="pl" href="https://pypi.org/project/psimodpy/" target="_blank" rel="noopener">PyPI</a>
        <a class="pl" href="https://github.com/tacular-omics/psimodpy" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
    <nav class="rel">
      <span>Related:</span>
      <a href="https://tacular-omics.github.io/unimodpy/">unimodpy</a>
      <a href="https://tacular-omics.github.io/uniprotptmpy/">uniprotptmpy</a>
    </nav>
  </div>
</header>
<main id="lvw">
  <div class="tb">
    <input type="search" id="q" placeholder="Search name, ID, definition, synonym…" autocomplete="off">
    <select id="for"><option value="">All origins</option></select>
    <select id="fsr"><option value="">All sources</option></select>
    <select id="fob">
      <option value="active">Active only</option>
      <option value="all">All entries</option>
      <option value="obsolete">Obsolete only</option>
    </select>
    <select id="fsl"><option value="">All subsets</option><option value="slim">Slim subset only</option></select>
  </div>
  <div class="ms" id="msb">
    <label>Δ mass <input id="mdelta" type="text" inputmode="decimal" placeholder="e.g. 42.0106" autocomplete="off" spellcheck="false"></label>
    <label>± <input id="mtol" type="text" inputmode="decimal" value="0.01" autocomplete="off" spellcheck="false" style="width:6rem"></label>
    <select id="munit" aria-label="Tolerance unit"><option value="da">Da</option><option value="ppm">ppm</option></select>
    <label id="mprecw" style="display:none">precursor <input id="mprec" type="text" inputmode="decimal" placeholder="mass (Da)" autocomplete="off" spellcheck="false"></label>
    <select id="mtype" aria-label="Mass type"><option value="mono">Monoisotopic</option><option value="avg">Average</option></select>
    <span class="mi" id="minfo" tabindex="0" role="note">?</span>
    <span class="mmsg" id="mmsg" role="status"></span>
  </div>
  <div class="bar">
    <span class="rc" id="rc">Loading…</span>
    <div class="pc">
      <select id="pp"><option value="50">50/page</option><option value="100">100/page</option><option value="250">250/page</option><option value="0">All</option></select>
      <button id="pv" disabled>‹</button>
      <span class="pi" id="pi"></span>
      <button id="nx" disabled>›</button>
    </div>
  </div>
  <div class="tw">
    <table class="nomass">
      <thead><tr>
        <th data-col="id"><span class="si">ID</span></th>
        <th data-col="name"><span class="si">Name</span></th>
        <th>Origin</th>
        <th data-col="diff_mono" style="text-align:right"><span class="si">Δ Mono (Da)</span></th>
        <th data-col="_err" class="ec" style="text-align:right"><span class="si" id="merrh">Δ error (Da)</span></th>
        <th>Formula</th>
        <th>Source</th>
        <th>Status</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<div id="dvp" style="display:none">
  <div style="max-width:1300px;margin:1rem auto;padding:0 1rem">
    <button class="dv-back" id="dvb">← Back to list</button>
    <div class="dv-hd">
      <div class="dv-id" id="dvi"></div>
      <div class="dv-nm" id="dvt"></div>
    </div>
    <div class="dv-bd" id="dvc"></div>
  </div>
</div>
<script>
'use strict';
const MASS_CFG={mono:'diff_mono',avg:'diff_avg',lib:'psimodpy',note:'The library skips obsolete terms by default; use the Active only filter to match it.',
  hasId:id=>BY_ID.has(Number(id))};
let ALL=[],filtered=[],sortCol='id',sortDir=1,page=0,perPage=50;
const BY_ID=new Map(),CHILDREN=new Map();
const SRC={natural:'tg0',artifact:'tgr',artifactual:'tgr',hypothetical:'to0',none:'tgr'};
function fmtId(id){return'MOD:'+String(id).padStart(5,'0');}
function fmtOrigin(o){
  if(!o)return'<span style="color:#d1d5db">—</span>';
  if(typeof o==='string')return`<span class="tag tb0">${x(o)}</span>`;
  if(o.type==='crosslink')return`<span class="tag tp0">XL:${o.sites.join('–')}</span>`;
  return x(String(o));
}
function termLink(id){
  const ent=BY_ID.get(id);
  const idStr=fmtId(id);
  const nm=ent?ent.name:'';
  return`<a class="tag tb0 term-link" href="?id=${id}" data-term-id="${id}">`
    +`<span class="tid">${idStr}</span>`
    +(nm?`<span class="tnm">${x(nm)}</span>`:'')
    +`</a>`;
}
async function init(){
  const r=await fetch('data.json');
  ALL=await r.json();
  BY_ID.clear();CHILDREN.clear();
  for(const e of ALL)BY_ID.set(e.id,e);
  for(const e of ALL){
    for(const pid of(e.is_a||[])){
      let arr=CHILDREN.get(pid);
      if(!arr){arr=[];CHILDREN.set(pid,arr);}
      arr.push(e.id);
    }
  }
  for(const arr of CHILDREN.values())arr.sort((a,b)=>a-b);
  document.getElementById('ec').textContent=ALL.length+' entries';
  const origs=new Set,srcs=new Set;
  for(const e of ALL){
    if(e.origin!==null){
      if(typeof e.origin==='string')origs.add(e.origin);
      else origs.add('Crosslink');
    }
    if(e.source)srcs.add(e.source);
  }
  fill('for',[...origs].sort());
  fill('fsr',[...srcs].sort());
  massInit();
  update();
  const qid=new URLSearchParams(location.search).get('id');
  if(qid){const e=BY_ID.get(Number(qid));if(e)showDetail(e);}
}
function fill(id,vals){const s=document.getElementById(id);vals.forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;s.appendChild(o);});}
function update(){page=0;applyFilters();applySort();render();massSync();}
function applyFilters(){
  massPrep();
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fo=document.getElementById('for').value,fsr=document.getElementById('fsr').value;
  const fob=document.getElementById('fob').value,fsl=document.getElementById('fsl').value;
  filtered=ALL.filter(e=>{
    if(fob==='active'&&e.is_obsolete)return false;
    if(fob==='obsolete'&&!e.is_obsolete)return false;
    if(fsl==='slim'&&!e.in_slim_subset)return false;
    if(q){
      const syns=(e.synonyms||[]).map(s=>s.value).join(' ');
      const h=`${fmtId(e.id)} ${e.name} ${e.definition||''} ${syns}`.toLowerCase();
      if(!h.includes(q))return false;
    }
    if(fo){
      if(fo==='Crosslink'){if(!e.origin||typeof e.origin!=='object')return false;}
      else{if(e.origin!==fo)return false;}
    }
    if(fsr&&e.source!==fsr)return false;
    if(!massKeep(e))return false;
    return true;
  });
}
function applySort(){
  if(sortCol==='_err'){filtered.sort(massCmp);return;}
  filtered.sort((a,b)=>{
    let av=a[sortCol],bv=b[sortCol];
    if(av==null)av=sortCol==='diff_mono'?Infinity:'';
    if(bv==null)bv=sortCol==='diff_mono'?Infinity:'';
    return(typeof av==='number'?(av-bv):String(av).localeCompare(String(bv)))*sortDir;
  });
}
function getPage(){if(!perPage)return filtered;return filtered.slice(page*perPage,(page+1)*perPage);}
function render(){
  const tbody=document.getElementById('tbody');
  const rows=getPage();
  if(!rows.length){tbody.innerHTML='<tr><td colspan="8" class="nr">No entries match your search.</td></tr>';updateBar();return;}
  tbody.innerHTML='';
  for(const e of rows){
    const tr=document.createElement('tr');tr.className='dr';
    const statTags=[];
    if(e.in_slim_subset)statTags.push('<span class="tag tg0">slim</span>');
    if(e.is_obsolete)statTags.push('<span class="tag trd">obsolete</span>');
    tr.innerHTML=`<td class="ic">${fmtId(e.id)}</td>
<td class="nc">${x(e.name)}</td>
<td>${fmtOrigin(e.origin)}</td>
<td class="mc">${e.diff_mono!=null?e.diff_mono.toFixed(6):'<span style="color:#d1d5db">—</span>'}</td>
${massCell(e)}
<td class="fc">${e.proforma_formula?`<code>${x(e.proforma_formula)}</code>`:'<span style="color:#d1d5db">—</span>'}</td>
<td>${e.source?`<span class="tag ${SRC[e.source]||'tgr'}">${x(e.source)}</span>`:'<span style="color:#d1d5db">—</span>'}</td>
<td><div class="tags">${statTags.join('')||'<span style="color:#d1d5db">—</span>'}</div></td>`;
    tr.addEventListener('click',()=>openDetail(e));
    tbody.appendChild(tr);
  }
  updateBar();
}
function openDetail(e){
  history.pushState({id:e.id},'',massUrl(String(e.id)));
  showDetail(e);
}
function showDetail(e){
  document.getElementById('lvw').style.display='none';
  document.getElementById('dvp').style.display='block';
  document.getElementById('dvi').textContent=fmtId(e.id);
  document.getElementById('dvt').textContent=e.name;
  const dvc=document.getElementById('dvc');
  dvc.innerHTML=detail(e);
  dvc.querySelectorAll('a[data-term-id]').forEach(a=>{
    a.addEventListener('click',ev=>{
      if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button===1)return;
      ev.preventDefault();
      const tid=Number(a.dataset.termId);
      const ent=BY_ID.get(tid);
      if(ent){window.scrollTo(0,0);openDetail(ent);}
    });
  });
  document.title=e.name+' — psimodpy';
}
function closeDetail(){
  history.pushState(null,'',massUrl(null));
  document.getElementById('dvp').style.display='none';
  document.getElementById('lvw').style.display='';
  document.title='PSI-MOD Browser — psimodpy';
}
function detail(e){
  const synRows=(e.synonyms||[]).map(s=>`<tr><td>${x(s.value)}</td><td class="mono" style="color:#6b7280;font-size:.75rem">${x(s.type)}</td></tr>`).join('');
  const parentIds=e.is_a||[];
  const parents=parentIds.length?`<div class="term-list">${parentIds.map(termLink).join('')}</div>`:'—';
  const childIds=CHILDREN.get(e.id)||[];
  const children=childIds.length?`<div class="term-list">${childIds.map(termLink).join('')}</div>`:'—';
  const rels=(e.relationships||[]).map(r=>`<div style="font-size:.82rem"><span style="color:#6b7280">${x(r.type)}</span> → <span class="mono">${fmtId(r.target_id)}</span></div>`).join('')||'—';
  const xrefs=[];
  if(e.xref_unimod)xrefs.push(`<div><span class="tag tb0">Unimod</span> ${x(e.xref_unimod)}</div>`);
  if(e.xref_uniprot_ptm)xrefs.push(`<div><span class="tag tg0">UniProt PTM</span> ${x(e.xref_uniprot_ptm)}</div>`);
  if(e.xref_gnome)xrefs.push(`<div><span class="tag tp0">GNOme</span> ${x(e.xref_gnome)}</div>`);
  if(e.xref_remap!=null)xrefs.push(`<div><span class="tag trd">Remap</span> ${fmtId(e.xref_remap)}</div>`);
  const statTags=[];
  if(e.in_slim_subset)statTags.push('<span class="tag tg0">slim</span>');
  if(e.is_obsolete)statTags.push('<span class="tag trd">obsolete</span>');
  return `<div class="dg" style="grid-column:1/-1"><div class="dl">Definition</div><div class="dv">${x(e.definition||'—')}</div></div>
<div class="dg">
<div><div class="dl">Δ Monoisotopic</div><div class="dv mono">${e.diff_mono!=null?e.diff_mono.toFixed(6)+' Da':'—'}</div></div>
<div><div class="dl">Δ Average</div><div class="dv mono">${e.diff_avg!=null?e.diff_avg.toFixed(4)+' Da':'—'}</div></div>
<div><div class="dl">Monoisotopic Mass</div><div class="dv mono">${e.mass_mono!=null?e.mass_mono.toFixed(6)+' Da':'—'}</div></div>
<div><div class="dl">Average Mass</div><div class="dv mono">${e.mass_avg!=null?e.mass_avg.toFixed(4)+' Da':'—'}</div></div>
${e.proforma_formula?`<div><div class="dl">Δ Formula</div><div class="dv mono"><code>${x(e.proforma_formula)}</code></div></div>`:''}
${e.origin!==null&&e.origin!==undefined?`<div><div class="dl">Origin</div><div class="dv">${fmtOrigin(e.origin)}</div></div>`:''}
${e.source?`<div><div class="dl">Source</div><div class="dv"><span class="tag ${SRC[e.source]||'tgr'}">${x(e.source)}</span></div></div>`:''}
${e.term_spec&&e.term_spec!=='none'?`<div><div class="dl">Term Specificity</div><div class="dv">${x(e.term_spec)}</div></div>`:''}
${e.formal_charge!=null?`<div><div class="dl">Formal Charge</div><div class="dv mono">${e.formal_charge>0?'+':''}${e.formal_charge}</div></div>`:''}
${statTags.length?`<div><div class="dl">Status</div><div class="dv" style="display:flex;gap:.2rem;flex-wrap:wrap">${statTags.join('')}</div></div>`:''}
</div>
${synRows?`<div style="margin-top:.75rem"><div class="dl">Synonyms (${e.synonyms.length})</div>
<table class="st"><thead><tr><th>Synonym</th><th>Type</th></tr></thead><tbody>${synRows}</tbody></table></div>`:''}
<div class="dg" style="margin-top:.75rem">
<div><div class="dl">Parent Terms${parentIds.length?' ('+parentIds.length+')':''}</div><div class="dv" style="margin-top:.2rem">${parents}</div></div>
<div><div class="dl">Direct Children${childIds.length?' ('+childIds.length+')':''}</div><div class="dv" style="margin-top:.2rem">${children}</div></div>
${rels!=='—'?`<div><div class="dl">Relationships</div><div class="dv" style="margin-top:.2rem">${rels}</div></div>`:''}
${xrefs.length?`<div><div class="dl">Cross-References</div><div class="dv" style="margin-top:.25rem;display:flex;flex-direction:column;gap:.2rem">${xrefs.join('')}</div></div>`:''}
</div>`;
}
function updateBar(){
  const t=filtered.length,tp=perPage?Math.ceil(t/perPage):1;
  const s=t?page*perPage+1:0,e2=perPage?Math.min((page+1)*perPage,t):t;
  document.getElementById('rc').textContent=t===0?'No entries found':`Showing ${s}–${e2} of ${t} entries`;
  document.getElementById('pi').textContent=perPage&&tp>1?`${page+1}/${tp}`:'';
  document.getElementById('pv').disabled=page===0;
  document.getElementById('nx').disabled=!perPage||page>=tp-1;
  document.querySelectorAll('th[data-col]').forEach(th=>{
    const sp=th.querySelector('span');if(sp)sp.className=th.dataset.col===sortCol?(sortDir===1?'sa':'sd'):'si';
  });
}
// ---- Mass search: identical in psimodpy, unimodpy and uniprotptmpy; only MASS_CFG (fields, hasId) differs. ----
// Same rule as the library's search_mass(): keep entries with |delta - mass| <= tol (+1e-9 relative
// slack, edges inclusive), error = delta - mass, closest first, ties in mass then database order.
const MS={on:false,delta:0,tolDa:0,unit:'da',prec:null,field:MASS_CFG.mono,err:new Map(),idx:new Map(),wasOn:false};
const MASS_DEF_TOL={da:'0.01',ppm:'10'};
function massEl(id){return document.getElementById(id);}
// Plain decimals only (no hex, Infinity, blanks inside), like Python's float() minus inf/nan/underscores.
const MASS_NUM_RE=/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i;
function massNum(s){s=String(s??'').trim();if(s==='')return null;if(!MASS_NUM_RE.test(s))return NaN;const v=Number(s);return Number.isFinite(v)?v:NaN;}
function massHelp(){
  return`Mass search: enter a signed delta mass in Da (e.g. 42.0106 or -18.0106). `
    +`Keeps entries whose ${MASS_CFG.mono} (Monoisotopic) or ${MASS_CFG.avg} (Average) is within the tolerance; `
    +`both edges are inclusive, the same rule as ${MASS_CFG.lib}'s search_mass() (which uses the monoisotopic mass and Da). `
    +`Entries with no mass are hidden while a mass is entered. Δ error = your mass − entry mass. `
    +`Da: an absolute window. ppm: a delta mass has no precursor of its own, so ppm is taken relative to the precursor `
    +`mass you enter (the modified peptide's neutral mass, Da): tolerance in Da = ppm × precursor ÷ 1,000,000, `
    +`and Δ error in ppm = error ÷ precursor × 1,000,000.`+(MASS_CFG.note?' '+MASS_CFG.note:'');
}
function massInit(){
  ALL.forEach((e,i)=>MS.idx.set(e,i));
  if(!MASS_CFG.avg)massEl('mtype').style.display='none';
  const h=massHelp();massEl('minfo').title=h;massEl('minfo').setAttribute('aria-label',h);massEl('mdelta').title=h;
  massEl('munit').querySelector('option[value=ppm]').title='ppm of the precursor mass you enter';
  massFromUrl();
  let t;
  ['mdelta','mtol','mprec'].forEach(id=>massEl(id).addEventListener('input',()=>{clearTimeout(t);t=setTimeout(update,200);}));
  massEl('munit').addEventListener('change',()=>{
    // A Da number is not a sensible ppm number (or back): reset to the unit's default.
    massEl('mtol').value=MASS_DEF_TOL[massEl('munit').value];
    update();
  });
  massEl('mtype').addEventListener('change',update);
}
function massPrep(){
  const d=massNum(massEl('mdelta').value),t=massNum(massEl('mtol').value),p=massNum(massEl('mprec').value);
  const unit=massEl('munit').value==='ppm'?'ppm':'da';
  MS.unit=unit;
  MS.field=massEl('mtype').value==='avg'&&MASS_CFG.avg?MASS_CFG.avg:MASS_CFG.mono;
  MS.prec=p!=null&&p>0?p:null;
  const tolBad=t==null||Number.isNaN(t)||t<0;
  let msg='';MS.on=false;
  if(Number.isNaN(d))msg='Mass must be a number, e.g. 42.0106 or -18.0106.';
  else if(d!=null){
    if(tolBad)msg='Tolerance must be a number ≥ 0.';
    else if(unit==='ppm'&&MS.prec==null)msg='ppm needs a precursor mass (Da): enter it, or switch to Da.';
    else{MS.on=true;MS.delta=d;MS.tolDa=unit==='ppm'?t*MS.prec/1e6:t;}
  }
  massEl('mdelta').classList.toggle('bad',Number.isNaN(d));
  massEl('mtol').classList.toggle('bad',d!=null&&tolBad);
  massEl('mprec').classList.toggle('bad',unit==='ppm'&&d!=null&&MS.prec==null);
  massEl('mmsg').textContent=msg;
  massEl('mprecw').style.display=unit==='ppm'?'':'none';
  document.querySelector('.tw table').classList.toggle('nomass',!MS.on);
  massEl('merrh').textContent='Δ error ('+unit.replace('da','Da')+(MS.field===MASS_CFG.avg?', avg':'')+')';
  if(MS.on&&!MS.wasOn){sortCol='_err';sortDir=1;}
  if(!MS.on&&sortCol==='_err'){sortCol='id';sortDir=1;}
  MS.wasOn=MS.on;
  MS.err.clear();
}
function massKeep(e){
  if(!MS.on)return true;
  const m=e[MS.field];
  if(typeof m!=='number'||!Number.isFinite(m))return false;
  const err=MS.delta-m,slack=1e-9*Math.max(1,Math.abs(MS.delta));
  if(Math.abs(err)>MS.tolDa+slack)return false;
  MS.err.set(e,err);
  return true;
}
function massCmp(a,b){
  // Only the error flips with the sort direction; ties stay in mass, then database, order.
  return(Math.abs(MS.err.get(a))-Math.abs(MS.err.get(b)))*sortDir||a[MS.field]-b[MS.field]||MS.idx.get(a)-MS.idx.get(b);
}
function massCell(e){
  const err=MS.err.get(e);
  if(err==null)return'<td class="mc ec"></td>';
  const v=MS.unit==='ppm'?(err/MS.prec*1e6).toFixed(2):err.toFixed(6);
  return`<td class="mc ec">${err>0?'+':''}${v}</td>`;
}
function massUrl(id){
  const u=new URLSearchParams();
  if(id===undefined){id=new URLSearchParams(location.search).get('id');if(id!=null&&!MASS_CFG.hasId(id))id=null;}
  if(id!=null)u.set('id',id);
  const q=massEl('q').value.trim();if(q)u.set('q',q);
  const d=massEl('mdelta').value.trim();
  if(d){
    u.set('mass',d);u.set('tol',massEl('mtol').value.trim());u.set('unit',massEl('munit').value);
    const p=massEl('mprec').value.trim();if(massEl('munit').value==='ppm'&&p)u.set('prec',p);
    if(massEl('mtype').value==='avg')u.set('mass_type','avg');
  }
  const s=u.toString();
  return location.pathname+(s?'?'+s:'');
}
function massSync(){const url=massUrl();if(url!==location.pathname+location.search)history.replaceState(history.state,'',url);}
function massFromUrl(){
  const u=new URLSearchParams(location.search);
  const unit=u.get('unit')==='ppm'?'ppm':'da';
  const want={q:u.get('q')??'',mdelta:u.get('mass')??'',mtol:u.get('tol')??MASS_DEF_TOL[unit],munit:unit,
    mprec:u.get('prec')??'',mtype:u.get('mass_type')==='avg'&&MASS_CFG.avg?'avg':'mono'};
  let changed=false;
  for(const[k,v]of Object.entries(want)){const el=massEl(k);if(el.value!==v){el.value=v;changed=true;}}
  return changed;
}
// ---- end mass search ----
function x(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
document.getElementById('dvb').addEventListener('click',closeDetail);
window.addEventListener('popstate',()=>{
  const qid=new URLSearchParams(location.search).get('id');
  if(qid){const e=BY_ID.get(Number(qid));if(e){showDetail(e);return;}}
  document.getElementById('dvp').style.display='none';
  document.getElementById('lvw').style.display='';
  document.title='PSI-MOD Browser — psimodpy';
  if(massFromUrl())update();
});
let dt;
document.getElementById('q').addEventListener('input',()=>{clearTimeout(dt);dt=setTimeout(update,200);});
['for','fsr','fob','fsl'].forEach(id=>document.getElementById(id).addEventListener('change',update));
document.getElementById('pp').addEventListener('change',e=>{perPage=+e.target.value;page=0;render();});
document.getElementById('pv').addEventListener('click',()=>{if(page>0){page--;render();}});
document.getElementById('nx').addEventListener('click',()=>{if(perPage&&page<Math.ceil(filtered.length/perPage)-1){page++;render();}});
document.querySelectorAll('th[data-col]').forEach(th=>{th.addEventListener('click',()=>{
  const c=th.dataset.col;sortDir=sortCol===c?-sortDir:1;sortCol=c;applySort();render();
});});
init().catch(e=>{document.getElementById('tbody').innerHTML=`<tr><td colspan="7" class="nr">Error loading data: ${x(e.message)}</td></tr>`;document.getElementById('rc').textContent='Error';});
</script>
</body>
