[project]
name = "psimodpy"
dynamic = ["version"]
description = "Python library for the PSI-MOD protein modification ontology"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
keywords = ["proteomics", "PSI-MOD", "protein modification", "ontology", "bioinformatics", "mass spectrometry"]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.1.1,<3",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/psimodpy"
Documentation = "https://github.com/tacular-omics/psimodpy#readme"
Repository = "https://github.com/tacular-omics/psimodpy"
Issues = "https://github.com/tacular-omics/psimodpy/issues"
Changelog = "https://github.com/tacular-omics/psimodpy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Source, tests and paperwork only: no paper, docs, lockfile or repo tooling.
only-include = [
    "src/psimodpy",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]

# PSI-MOD.obo matches a .gitignore pattern, so hatch needs it named explicitly.
[tool.hatch.build.targets.sdist.force-include]
"src/psimodpy/data/PSI-MOD.obo" = "src/psimodpy/data/PSI-MOD.obo"

[tool.hatch.build.targets.wheel]
packages = ["src/psimodpy"]

[tool.hatch.build.targets.wheel.force-include]
"src/psimodpy/data/PSI-MOD.obo" = "psimodpy/data/PSI-MOD.obo"

[tool.hatch.version]
path = "src/psimodpy/__init__.py"

[tool.uv]
package = true


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-data sweeps and subprocess launches; skipped unless --run-slow or RUN_SLOW=1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
source = ["src/psimodpy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
